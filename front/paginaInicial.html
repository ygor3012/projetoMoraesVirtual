<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="paginaInicial.css" />
    <title>Bem-vindo</title>
  </head>
  <body>
    <header class="header_inicial">
      <h1 id="titulo">Colégio Antônio de Moraes Barros</h1>
      <div class="navs">
        <a href="">Inicio</a>
        <a href="">Sobre</a>
        <a href="">Contato</a>
        <a href="" id="area_admin">Área de Admin</a>
      </div>
    </header>

    <container class="container_cima">
      <section class="corpo_inicial_esquerda">
        <p id="frase_inicial">
          Transformando Educação em
          <label id="oportunidades">Oportunidades</label>
        </p>
        <p id="bordao">
          Bem-vindo ao portal oficial do Colégio Antônio de Moraes Barros. Aqui
          você encontra informações, notícias, atividades e muito mais.
        </p>
        <div class="buttons">
        <button class="button1" id="recados">Ver recados</button>
        <button class="button1" id="conhecer">Conhecer a escola</button>
        </div>
      </section>

      <section class="corpo_inicial_direita">
        <img id="patio" src="./imgs/entrada.png" alt="patioEscola"/>
      </section>
    </container>

    <container class="acessoRapido">
        <h2 id="acesso">Acesso Rapido</h2>
        <div id="acessoRapido">
            <img src="imgs/grupoRecados (2).png" alt="recadosCard">
            <img src="imgs/grupoHorarios.png" alt="recadosCard">
            <img src="imgs/grupoCardapios.png" alt="recadosCard">
        </div>
    </container>


  </body>
</html>
