<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="telaLogin.css" />
    <title>Login - Área Administrativa</title>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <a href="paginaInicial.html" class="voltar">← Voltar para o site</a>
        <h2>Área do Administrador</h2>
        <p class="login-subtitle">Faça login para gerenciar os conteúdos da escola.</p>
        
        <form>
          <div class="input-group">
            <label for="usuario">Usuário ou E-mail</label>
            <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required>
          </div>

          <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-entrar">Entrar</button>

          
        </form>
        <div id="ou_google">
          <p>‒‒‒‒‒‒‒‒‒‒‒‒‒‒‒‒‒‒ ou ‒‒‒‒‒‒‒‒‒‒‒‒‒‒‒‒‒‒</p>
          <button type="submit" class="btn-entrar-google"><img style="width: 20px;" src="./imgs/googleLogo.webp" alt="google"></button>
          </div>
      </div>
    </div>
    <script type="module" src="telaLogin.js"></script>
    <script type="module" src="telaLoginGoogle.js"></script>
  </body>
</html>
